<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Upscale & Reducer - Raja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>🖼️ Image Upscale & Reducer</h2>
  <p class="owner">Created by <span>Raja</span></p>

  <input type="file" id="upload" accept="image/*">

  <div class="row">
    <input type="number" id="width" placeholder="Width">
    <input type="number" id="height" placeholder="Height">
  </div>

  <select id="unit">
    <option value="px">Pixels (px)</option>
    <option value="cm">Centimeters (cm)</option>
    <option value="inch">Inches</option>
    <option value="feet">Feet</option>
  </select>

  <div class="row">
    <input type="number" id="targetSize" placeholder="Target Size">
    <select id="sizeUnit">
      <option value="kb">KB</option>
      <option value="mb">MB</option>
    </select>
  </div>

  <button onclick="processImage()">Resize & Convert</button>

  <canvas id="canvas"></canvas>

  <p id="finalSize"></p>

  <a id="download" download="image-by-raja.jpg">⬇ Download Image</a>

  <p id="statusMsg">✅ Ready to upload new image</p>
</div>

<script src="script.js"></script>
</body>
</html>
